name: MEV-Boost Integration Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  RBUILDER_VERSION: v1.2.6
  PLAYGROUND_TIMEOUT: 180s  # Reduced from 300s
  TEST_TIMEOUT: 300s        # Reduced from 600s

jobs:
  integration-test:
    runs-on: ubuntu-latest-4-cores  # Use larger runner
    timeout-minutes: 20             # Reduced from 30

    steps:
    - name: Checkout mev-boost
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5    # Updated to v5
      with:
        go-version: '1.24'
        cache: true                # Enable Go module caching

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable  # More efficient Rust setup
      with:
        toolchain: stable

    # Comprehensive caching strategy
    - name: Cache dependencies
      uses: actions/cache@v4       # Updated to v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          /tmp/rbuilder/target/
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-deps-${{ hashFiles('**/Cargo.lock', '**/go.mod', '**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    - name: Set up Docker Buildx with cache
      uses: docker/setup-buildx-action@v3

    # Parallel preparation of dependencies
    - name: Prepare environment (parallel)
      run: |
        # Clone and prepare builder-playground in parallel
        git clone --depth 1 https://github.com/flashbots/builder-playground.git &
        CLONE_PID=$!
        
        # Download rbuilder in parallel
        (
          cd /tmp
          if [ ! -d "rbuilder" ]; then
            wget -q https://github.com/flashbots/rbuilder/archive/refs/tags/${{ env.RBUILDER_VERSION }}.tar.gz
            tar -xzf ${{ env.RBUILDER_VERSION }}.tar.gz
            mv rbuilder-* rbuilder
          fi
        ) &
        DOWNLOAD_PID=$!
        
        # Wait for both operations
        wait $CLONE_PID $DOWNLOAD_PID
        
        # Prepare go modules
        cd builder-playground
        go mod download

    - name: Build MEV-Boost Docker image (cached)
      uses: docker/build-push-action@v5
      with:
        context: .
        tags: my-mev-boost:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    - name: Pre-build rbuilder
      run: |
        cd /tmp/rbuilder
        
        # Check if already built
        if [ ! -f "target/release/rbuilder" ]; then
          echo "Building rbuilder..."
          # Use parallel compilation with all available cores
          CARGO_BUILD_JOBS=$(nproc) cargo build --release --bin rbuilder
        else
          echo "rbuilder already built (from cache)"
        fi

    - name: Start services with optimized timing
      run: |
        cd builder-playground
        
        # Start the playground in background
        timeout ${{ env.PLAYGROUND_TIMEOUT }} go run main.go cook l1 \
          --genesis-delay 15 \
          --log-level debug \
          --use-native-reth \
          --use-separate-mev-boost \
          --override mev-boost=my-mev-boost:latest &
        
        PLAYGROUND_PID=$!
        echo "PLAYGROUND_PID=$PLAYGROUND_PID" >> $GITHUB_ENV
        
        # Wait for services to be ready
        echo "Waiting for services to start..."
        
        check_service() {
          local url=$1
          local name=$2
          local max_attempts=30
          local data=${3:-""}
          
          for i in $(seq 1 $max_attempts); do
            if [ -n "$data" ]; then
              if curl -s -m 2 -X POST -H "Content-Type: application/json" --data "$data" "$url" > /dev/null 2>&1; then
                echo "$name is ready (attempt $i)"
                return 0
              fi
            else
              if curl -s -m 2 "$url" > /dev/null 2>&1; then
                echo "$name is ready (attempt $i)"
                return 0
              fi
            fi
            sleep 2  # Reduced from 5 seconds
          done
          echo "Failed to connect to $name after $max_attempts attempts"
          return 1
        }
        
        # Check services in parallel
        check_service "http://localhost:8545" "Execution layer" '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' &
        check_service "http://localhost:3500/eth/v1/beacon/headers/head" "Beacon node" &
        check_service "http://localhost:18550/eth/v1/builder/status" "MEV-boost" &
        check_service "http://localhost:5555/eth/v1/builder/status" "Relay" &
        
        # Wait for all checks to complete
        wait
        
        echo "All services are ready!"

    - name: Start rbuilder (optimized)
      run: |
        cd /tmp/rbuilder
        
        # Update config with optimized settings
        sed -i "s|\$HOME|$HOME|g" config-playground.toml
        
        # Start rbuilder with the pre-built binary
        ./target/release/rbuilder run config-playground.toml &
        RBUILDER_PID=$!
        echo "RBUILDER_PID=$RBUILDER_PID" >> $GITHUB_ENV
        
        # Reduced startup wait time
        sleep 8
        
        # Quick process check
        if ! ps -p $RBUILDER_PID > /dev/null 2>&1; then
          echo "❌ rbuilder process failed to start"
          exit 1
        fi
        
        echo "✅ rbuilder started successfully"

    - name: Run integration tests (parallel where possible)
      run: |
        echo "Running MEV-boost integration tests..."
        
        export MEV_BOOST_URL="http://localhost:18550"
        export BEACON_NODE_URL="http://localhost:3500" 
        export RELAY_URL="http://localhost:5555"
        
                 # Run tests with shorter timeout
         timeout ${{ env.TEST_TIMEOUT }} go test -v ./server \
           -run TestMEVBoostIntegration \
           -timeout=5m \
           -count=1
        
        echo "Integration tests completed successfully!"

    - name: Cleanup
      if: always()
      run: |
        echo "Cleaning up processes..."
        
        # More aggressive cleanup
        [ ! -z "$PLAYGROUND_PID" ] && kill -9 $PLAYGROUND_PID 2>/dev/null || true
        [ ! -z "$RBUILDER_PID" ] && kill -9 $RBUILDER_PID 2>/dev/null || true
        
        # Parallel cleanup
        (docker stop $(docker ps -q) 2>/dev/null || true) &
        (pkill -9 -f "rbuilder" 2>/dev/null || true) &
        (pkill -9 -f "playground" 2>/dev/null || true) &
        
        wait
        docker system prune -f 2>/dev/null || true
        
        echo "Cleanup completed"