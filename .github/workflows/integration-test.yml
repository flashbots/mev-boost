name: MEV-Boost Integration Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  RBUILDER_VERSION: v1.2.6
  PLAYGROUND_TIMEOUT: 180s  # Reduced from 300s
  TEST_TIMEOUT: 300s        # Reduced from 600s

jobs:
  integration-test:
    name: "Integration Test (${{ matrix.fork }} fork)"
    runs-on: ubuntu-latest  # Use larger runner
    timeout-minutes: 40
    strategy:
      matrix:
        fork: [deneb, electra]
      fail-fast: false  # Continue testing other forks even if one fails

    steps:
    - name: Checkout mev-boost
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5    # Updated to v5
      with:
        go-version: '1.24'
        cache: true                # Enable Go module caching

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: Build MEV-Boost Docker image
      run: |
        docker build -t my-mev-boost:latest .
    - name: Clone builder-playground
      run: |
        # Clean up any existing builder-playground directory
        rm -rf builder-playground
        git clone https://github.com/flashbots/builder-playground.git
        cd builder-playground
        go mod download
    - name: Download rbuilder
      run: |
        cd /tmp
        # Clean up any existing rbuilder directory
        rm -rf rbuilder
        wget https://github.com/flashbots/rbuilder/archive/refs/tags/${{ env.RBUILDER_VERSION }}.tar.gz
        tar -xzf ${{ env.RBUILDER_VERSION }}.tar.gz
        mv rbuilder-* rbuilder
    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          /tmp/rbuilder/target/
          /tmp/contender/target/
        key: ${{ runner.os }}-rust-${{ env.RBUILDER_VERSION }}-${{ matrix.fork }}-${{ hashFiles('/tmp/rbuilder/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-${{ env.RBUILDER_VERSION }}-${{ matrix.fork }}-
          ${{ runner.os }}-rust-${{ env.RBUILDER_VERSION }}-
          ${{ runner.os }}-rust-
    - name: Start playground environment
      run: |
        cd builder-playground
        
        # Start the playground in background (conditionally enable latest fork)
        echo "Starting playground with ${{ matrix.fork }} fork..."
        if [ "${{ matrix.fork }}" = "electra" ]; then
          FORK_FLAG="--latest-fork"
        else
          FORK_FLAG=""
        fi
        
        timeout ${{ env.PLAYGROUND_TIMEOUT }} go run main.go cook l1 \
          --genesis-delay 15 \
          --log-level debug \
          --use-separate-mev-boost \
          --override mev-boost=my-mev-boost:latest \
          $FORK_FLAG &
        
        PLAYGROUND_PID=$!
        echo "PLAYGROUND_PID=$PLAYGROUND_PID" >> $GITHUB_ENV
        
        # Wait for services to be ready
        echo "Waiting for services to start..."
        
        # Wait for beacon node
        for i in {1..60}; do
          if curl -s http://localhost:3500/eth/v1/beacon/headers/head > /dev/null 2>&1; then
            echo "Beacon node is ready"
            break
          fi
          echo "Waiting for beacon node... ($i/60)"
          sleep 5
        done
        
        # Wait for execution layer
        for i in {1..60}; do
          if curl -s -X POST -H "Content-Type: application/json" \
            --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
            http://localhost:8545 > /dev/null 2>&1; then
            echo "Execution layer is ready"
            break
          fi
          echo "Waiting for execution layer... ($i/60)"
          sleep 5
        done
        
        # Wait for MEV-boost
        for i in {1..60}; do
          if curl -s http://localhost:18550/eth/v1/builder/status > /dev/null 2>&1; then
            echo "MEV-boost is ready"
            break
          fi
          echo "Waiting for MEV-boost... ($i/60)"
          sleep 5
        done
        
        # Wait for relay
        for i in {1..60}; do
          if curl -s http://localhost:5555/eth/v1/builder/status > /dev/null 2>&1; then
            echo "Relay is ready"
            break
          fi
          echo "Waiting for relay... ($i/60)"
          sleep 5
        done
        
        echo "All services are ready!"
    - name: Build rbuilder
      run: |
        cd /tmp/rbuilder
        
        # Pre-compile rbuilder in release mode for better performance and reliability
        echo "Building rbuilder (this may take several minutes)..."
        cargo build --release --bin rbuilder
        
        echo "rbuilder build completed"
    - name: Start rbuilder
      run: |
        cd /tmp/rbuilder
        
        # Update config-playground.toml with correct paths
        sed -i "s|\$HOME|$HOME|g" config-playground.toml
        # Update reth datadir and IPC paths to match playground structure  
        sed -i "s|reth_datadir = \".*\"|reth_datadir = \"${HOME}/.playground/devnet/volume-el-data\"|g" config-playground.toml
        sed -i "s|el_node_ipc_path = \".*\"|el_node_ipc_path = \"${HOME}/.playground/devnet/volume-el-data/reth.ipc\"|g" config-playground.toml

        echo "Updated rbuilder config paths:"
        grep -E "(reth_datadir|el_node_ipc_path)" config-playground.toml
        
        # Debug: Check what actually exists in the playground directory
        echo "Debugging playground directory structure:"
        ls -la $HOME/.playground/devnet/ || echo "devnet directory not found"
        ls -la $HOME/.playground/devnet/volume-el-data/ || echo "volume-el-data directory not found"
        find $HOME/.playground/devnet/ -name "*.ipc" -type s 2>/dev/null || echo "No IPC files found"
        
        # Check if reth is using a different path structure
        echo "Looking for any reth-related files:"
        find $HOME/.playground/devnet/ -name "*reth*" 2>/dev/null || echo "No reth files found"
        
        # Look for ALL IPC files anywhere in the system
        echo "Searching for ANY IPC socket files:"
        find $HOME/.playground/ -name "*.ipc" -type s 2>/dev/null || echo "No .ipc socket files found"
        find /tmp -name "*.ipc" -type s 2>/dev/null || echo "No .ipc files in /tmp"
        
        # Check if reth process is actually running
        echo "Checking if reth process is running:"
        ps aux | grep reth || echo "No reth process found"
        
        # Check docker containers that might be running reth
        echo "Checking docker containers:"
        docker ps | grep -E "(reth|el)" || echo "No reth/el containers found"
        
        # If reth is in docker, check if IPC is mounted/accessible
        echo "Checking docker volume mounts for IPC:"
        docker inspect $(docker ps -q) 2>/dev/null | grep -A 5 -B 5 "ipc\|reth" || echo "No IPC mounts found"
        
        # Wait a bit more for IPC file to be created
        echo "Waiting for IPC file to be created..."
        for i in {1..30}; do
          if [ -S "$HOME/.playground/devnet/volume-el-data/reth.ipc" ]; then
            echo "✅ Found IPC file at attempt $i"
            ls -la "$HOME/.playground/devnet/volume-el-data/reth.ipc"
            break
          fi
          echo "Waiting for IPC file... ($i/30)"
          sleep 2
        done
        
        # Final check - what's the actual IPC path we should use?
        echo "Final IPC file check:"
        ls -la "$HOME/.playground/devnet/volume-el-data/reth.ipc" || echo "IPC file still not found"

        echo "All docker containers (including stopped):"
        docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

        # Final config check before starting rbuilder
        echo "Final rbuilder config:"
        cat config-playground.toml | grep -A 1 -B 1 -E "(reth_datadir|el_node_ipc_path)"
        
        # Test IPC connection before starting rbuilder
        echo "Testing IPC file accessibility:"
        ls -la "${HOME}/.playground/devnet/volume-el-data/reth.ipc"
        echo "IPC file permissions and ownership:"
        stat "${HOME}/.playground/devnet/volume-el-data/reth.ipc"
        
        # Try to connect to IPC as a test
        echo "Testing IPC connection:"
        timeout 5 socat - UNIX-CONNECT:"${HOME}/.playground/devnet/volume-el-data/reth.ipc" <<< '{"jsonrpc":"2.0","method":"web3_clientVersion","params":[],"id":1}' || echo "IPC connection test failed"
        
        # Start rbuilder using pre-built binary with logging (run as root to access reth db)
        echo "Starting rbuilder with full logging (as root for db access)..."
        sudo ./target/release/rbuilder run config-playground.toml 2>&1 | tee rbuilder.log &
        RBUILDER_PID=$!
        echo "RBUILDER_PID=$RBUILDER_PID" >> $GITHUB_ENV
        echo "Started rbuilder with PID: $RBUILDER_PID"

        # Wait for rbuilder to actually start and begin processing
        echo "Waiting for rbuilder to start and connect to services..."
        sleep 15  # Brief wait for startup
        
        # Check if rbuilder is actually running and processing
        for i in {1..30}; do
          if ps -p $RBUILDER_PID > /dev/null 2>&1; then
            echo "✅ rbuilder process is running (attempt $i/30)"
            # Give it a bit more time to fully initialize
            sleep 5
            break
          else
            echo "❌ rbuilder process died, checking logs..."
            echo "=== rbuilder.log contents ==="
            cat rbuilder.log || echo "No rbuilder.log found"
            echo "=== End of rbuilder.log ==="
            
            echo "Checking if IPC file still exists:"
            ls -la "${HOME}/.playground/devnet/volume-el-data/reth.ipc" || echo "IPC file disappeared"
            
            echo "Checking reth container status:"
            docker ps | grep devnet-el-1 || echo "reth container stopped"
            
            exit 1
          fi
        done
        
        echo "rbuilder started successfully"
        
        # Give rbuilder time to fully initialize and start monitoring
        echo "Allowing rbuilder to fully initialize..."
        sleep 10

    - name: Start contender (transaction spammer)
      run: |
        echo "Cloning and building contender..."
        # Clean up any existing contender directory
        rm -rf /tmp/contender
        git clone https://github.com/flashbots/contender.git /tmp/contender
        cd /tmp/contender
        
        # Build contender
        cargo build --release --bin contender
        
        echo "Starting contender to spam transactions..."
        # Run contender to generate continuous transaction flow
        ./target/release/contender spam \
          --tps 5 \
          -r http://localhost:8545 \
          -p 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
          --min-balance 0.5eth \
          --tx-type legacy \
          transfers &
        
        CONTENDER_PID=$!
        echo "CONTENDER_PID=$CONTENDER_PID" >> $GITHUB_ENV
        echo "Started contender with PID: $CONTENDER_PID"
        
        # Check if contender started successfully
        sleep 3
        if ps -p $CONTENDER_PID > /dev/null 2>&1; then
          echo "✅ Contender process is running"
        else
          echo "❌ Contender process died immediately, checking for error..."
          # contender might have exited with error
        fi
        
        # Wait for transactions to start flowing
        echo "Waiting for transaction activity to begin..."
        for i in {1..30}; do
          # Check if transactions are appearing in execution layer mempool
          TX_COUNT=$(curl -s -X POST -H "Content-Type: application/json" \
            --data '{"jsonrpc":"2.0","method":"txpool_status","params":[],"id":1}' \
            http://localhost:8545 | jq -r '.result.pending // "0"' | sed 's/0x//' | xargs printf "%d")
          
          if [ "$TX_COUNT" -gt 0 ]; then
            echo "✅ Transaction activity detected ($TX_COUNT pending transactions)"
            break
          fi
          
          echo "Waiting for transaction activity... ($i/30)"
          sleep 2
        done
        
        # Give rbuilder time to process transactions and create bids
        echo "Allowing rbuilder to process transactions and create bids..."
        sleep 15
        
        # Validate that rbuilder is seeing transactions
        echo "Checking rbuilder activity..."
        if ps -p $RBUILDER_PID > /dev/null 2>&1; then
          echo "✅ rbuilder is still running"
          echo "Recent rbuilder logs (checking for transaction activity):"
          tail -20 /tmp/rbuilder/rbuilder.log | grep -E "(tx_count|bundle_count|Building|bid)" || echo "No transaction/bid activity in recent logs"
        else
          echo "❌ rbuilder died"
          cat /tmp/rbuilder/rbuilder.log
          exit 1
        fi
 
    - name: Run MEV-Boost integration tests
      run: |
        echo "Running MEV-boost integration tests..."
        
        # Set environment for tests
        export MEV_BOOST_URL="http://localhost:18550"
        export BEACON_NODE_URL="http://localhost:3500"
        export RELAY_URL="http://localhost:5555"
        export TESTING_FORK="${{ matrix.fork }}"
        
        echo "Running MEV-boost integration tests for ${{ matrix.fork }} fork..."
        
        # Run the integration tests with timeout
        timeout ${{ env.TEST_TIMEOUT }} go test -v ./server -run TestMEVBoostIntegration -timeout=10m
        TEST_EXIT_CODE=$?
        
        if [ $TEST_EXIT_CODE -eq 0 ]; then
          echo "Integration tests passed!"
        else
          echo "Integration tests failed with exit code $TEST_EXIT_CODE"
          
          # Debug why tests failed
          echo "=== POST-TEST DEBUGGING ==="
          
          echo "Process status:"
          if ps -p $RBUILDER_PID > /dev/null 2>&1; then
            echo "✅ rbuilder still running"
          else
            echo "❌ rbuilder died during tests"
          fi
          
          if ps -p $CONTENDER_PID > /dev/null 2>&1; then
            echo "✅ contender still running"
          else
            echo "❌ contender died during tests"
          fi
          
          echo "Recent rbuilder logs (last 50 lines):"
          tail -50 /tmp/rbuilder/rbuilder.log || echo "No rbuilder logs found"
          
          echo "Checking relay for any bid activity:"
          curl -s "http://localhost:5555/relay/v1/data/bidtraces/builder_blocks_received" | jq '.[0:3]' || echo "No relay bid data"
          
          echo "Checking payload deliveries:"
          curl -s "http://localhost:5555/relay/v1/data/bidtraces/proposer_payload_delivered" | jq 'length' || echo "No payload delivery data"
          
          echo "Checking transaction flow:"
          echo "1. Execution layer transaction pool:"
          curl -s -X POST -H "Content-Type: application/json" \
            --data '{"jsonrpc":"2.0","method":"txpool_status","params":[],"id":1}' \
            http://localhost:8545 | jq . || echo "No txpool data"
          
          echo "2. Recent rbuilder logs for transaction processing:"
          tail -30 /tmp/rbuilder/rbuilder.log | grep -E "(tx_count|bundle_count|orderpool|simulation)" || echo "No transaction processing logs"
          
          echo "3. Checking if rbuilder is receiving transactions via IPC:"
          tail -30 /tmp/rbuilder/rbuilder.log | grep -E "(IPC|connection|Cleaned orderpool)" || echo "No IPC logs"
          
          exit $TEST_EXIT_CODE
        fi
    - name: Cleanup
      if: always()
      run: |
        echo "Cleaning up processes..."
        
        # Kill all background processes
        [ ! -z "$PLAYGROUND_PID" ] && kill $PLAYGROUND_PID 2>/dev/null || true
        [ ! -z "$RBUILDER_PID" ] && kill $RBUILDER_PID 2>/dev/null || true
        [ ! -z "$CONTENDER_PID" ] && kill $CONTENDER_PID 2>/dev/null || true
        
        # Stop all docker containers
        docker stop $(docker ps -q) 2>/dev/null || true
        docker rm $(docker ps -aq) 2>/dev/null || true
        
        # Kill any remaining processes
        pkill -f "rbuilder" 2>/dev/null || true
        pkill -f "playground" 2>/dev/null || true
        pkill -f "contender" 2>/dev/null || true
        
        echo "Cleanup completed"